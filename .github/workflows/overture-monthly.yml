name: Overture monthly

# OPS-8 / ADR 014: refresh Data/sources/overture/<city>.json for every city in
# Data/cities.json from the latest (or a chosen) Overture Maps release, and open a
# PR with the change. Overture data never auto-merges: a person reviews and merges it.
#
#   python3 Data/overture_extract.py <city> --release <input> --out Data/sources/overture/<city>.json
#
# The extractor resolves "latest" itself; the run reads the release back from the files
# (every city must agree) and names the branch after it: data/overture-<release>.
# A file that differs from main only in its "generated" date counts as unchanged. If no
# file changed the run ends green with a summary and opens nothing. If the branch already has an open PR
# (a re-run), the branch is force-pushed and the PR body updated.
#
# The PR is opened with this job's GITHUB_TOKEN (no PAT). GitHub does not start other
# workflows for events caused by GITHUB_TOKEN, so CI and the secret scan do NOT run on
# that PR by themselves. To run them: push an empty commit to the branch
#   git commit --allow-empty -m "ci: run checks" && git push
# or close and reopen the PR.
#
# Overture's monthly release usually lands around the third week; the 3rd of the next
# month leaves margin. Data is read anonymously from Overture's public S3 bucket.

on:
  schedule:
    - cron: "0 4 3 * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Overture release: "latest" or YYYY-MM-DD.N'
        type: string
        default: latest

concurrency:
  group: overture-monthly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    name: Extract and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      # Scheduled runs have no inputs.
      RELEASE_INPUT: ${{ inputs.release || 'latest' }}
      BASE: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: Data/requirements-overture.txt
      - name: Install pinned requirements
        run: |
          set -euo pipefail
          python3 -m pip install -r Data/requirements-overture.txt
          python3 -m pip list 2>/dev/null | grep -i duckdb

      - name: Extract every city
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_INPUT" =~ ^(latest|[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+)$ ]]; then
            echo "::error::release must be \"latest\" or YYYY-MM-DD.N, got: $RELEASE_INPUT"; exit 1
          fi
          mkdir -p Data/sources/overture
          for city in $(python3 -c 'import json; print(" ".join(sorted(json.load(open("Data/cities.json")))))'); do
            out="Data/sources/overture/$city.json"
            echo "::group::$city"
            echo "python3 Data/overture_extract.py $city --release $RELEASE_INPUT --out $out"
            python3 Data/overture_extract.py "$city" --release "$RELEASE_INPUT" --out "$out"
            ls -l "$out"
            echo "::endgroup::"
          done

      # Reads the release back from the files (they must all agree), compares each file
      # with HEAD ignoring the extractor's "generated" date, restores files that only
      # differ in that date, and writes per-city counts and sizes to the step summary
      # (reused as the PR body).
      - name: Summarise
        id: summary
        run: |
          set -euo pipefail
          python3 - > "$RUNNER_TEMP/summary.md" <<'PY'
          import json, os, subprocess

          def load(raw):
              return None if raw is None else json.loads(raw)

          def head(path):
              r = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True)
              return r.stdout if r.returncode == 0 else None

          def same(a, b):
              strip = lambda d: {k: v for k, v in d.items() if k != "generated"}
              return a is not None and strip(a) == strip(b)

          fmt = lambda n: "–" if n is None else f"{n:,}"
          delta = lambda a, b: "new" if a is None else f"{b - a:+,}"

          cities = sorted(json.load(open("Data/cities.json")))
          rows, changed, releases = [], [], set()
          for c in cities:
              p = f"Data/sources/overture/{c}.json"
              old_raw, new_raw = head(p), open(p, "rb").read()
              old, new = load(old_raw), load(new_raw)
              releases.add(new["release"])
              if same(old, new):
                  subprocess.run(["git", "checkout", "HEAD", "--", p], check=True)
                  new_raw = old_raw
              else:
                  changed.append(c)
              oc = None if old is None else len(old["places"])
              osz = None if old_raw is None else len(old_raw)
              prev = "–" if old is None else old["release"]
              rows.append(f"| {c} | {prev} | {fmt(len(new['places']))} | {delta(oc, len(new['places']))} "
                          f"| {fmt(len(new_raw))} | {delta(osz, len(new_raw))} | {'yes' if c in changed else 'no'} |")
          if len(releases) != 1:
              raise SystemExit(f"cities were extracted from different releases: {sorted(releases)}")
          release = releases.pop()
          print(f"## Overture places {release}\n")
          print("| city | previous release | places | Δ places | size (bytes) | Δ size | changed |")
          print("|---|---|---:|---:|---:|---:|---|")
          print("\n".join(rows))
          print()
          print(f"{len(changed)} file(s) changed: {', '.join(changed)}." if changed
                else "No changes (ignoring the generated date): no PR opened.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"release={release}\nchanged={len(changed)}\n")
          PY
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/summary.md"

      - name: Open PR
        if: steps.summary.outputs.changed != '0'
        env:
          RELEASE: ${{ steps.summary.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="data/overture-$RELEASE"
          title="data: Overture places $RELEASE"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Extracted by [Overture monthly]($RUN_URL) from \`$BASE\` with \`Data/overture_extract.py --release $RELEASE\` (ADR 014, OPS-8)."
            echo "Overture data never auto-merges: review the counts and merge by hand."
            echo
            echo "**CI has not run on this PR.** It was opened with the workflow's GITHUB_TOKEN, and GitHub does not start"
            echo "other workflows for that. To run the checks, push an empty commit to \`$branch\`"
            echo "(\`git commit --allow-empty -m \"ci: run checks\" && git push\`) or close and reopen this PR."
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A Data/sources/overture
          git commit -q -m "$title" -m "Data/sources/overture refreshed by $RUN_URL"
          git push --force origin "$branch"

          existing="$(gh pr list --head "$branch" --base "$BASE" --state open --json url --jq '.[0].url')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            url="$existing"
          else
            url="$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
          fi
          echo "PR: $url"
          { echo; echo "PR: $url"; } >> "$GITHUB_STEP_SUMMARY"
